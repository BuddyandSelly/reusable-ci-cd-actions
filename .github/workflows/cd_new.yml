# Kept for its existing callers only. cd.yml is identical and is the canonical copy;
# point callers there and delete this file. Any change made here has to be made there too
# until that happens.
name: "Continuous Deployment"
on:
  # Make workflow reusable
  workflow_call:
    inputs:
      APP_NAME:
        type: string
        required: true
      GAR_BETA_REGION:
        type: string
        required: true
      GAR_PROD_REGION:
        type: string
        required: true
      GCP_STAGING_PROJECT_ID:
        type: string
        required: true
      GCP_PROD_PROJECT_ID:
        type: string
        required: true
      GAR_STAGING_REPO:
        type: string
        required: true
      GAR_PRODUCTION_REPO:
        type: string
        required: true
      DOCKER_BUILD_TARGET:
        type: string
        required: false
        default: 'production'
      debug:
        type: boolean
        required: false
        default: false
      service:
        type: string
        required: false
        default: 'gcloud'
    secrets:
      PROD_GOOGLE_AUTH:
        required: true
      BETA_GOOGLE_AUTH:
        required: true

jobs:
  deployment:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    env:
      PROD_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'production') || github.event_name == 'push' }}
      STAGING_DEPLOY: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production') }}
      STAGING_DEPLOY_ENV: ${{github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env || 'beta'}}
      DEPLOY_BRANCH: ${{github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref}}
      # kubectl's gke-gcloud-auth-plugin takes its token from the credentials the
      # google-github-actions/auth step below exported (the same key as
      # KB_AUTH_TOKEN), not from `gcloud config config-helper`. On gcloud 591.0.0 that
      # helper crashes on a service account key while the auth action's
      # CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE is in place ("'Credentials' object has no
      # attribute 'private_key_id'", google-github-actions/auth#535), which has failed
      # every deployment through this workflow since 2026-11-02. buddy's own cd.yml has
      # set the same since 2026-10-30.
      CLOUDSDK_CONTAINER_USE_APPLICATION_DEFAULT_CREDENTIALS: 'true'

    steps:
      # common steps

      # Blacksmith keeps a git mirror on a sticky disk and updates it, instead of
      # cloning the repository from scratch every run. dissociate copies the objects
      # into the workspace, so nothing downstream is left depending on the mirror
      # mount: the deployment steps below run outside this action's control.
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          dissociate: true

      - name: Cancel Previous Workflow Actions
        uses: styfle/cancel-workflow-action@0.12.0
        with:
          access_token: ${{ github.token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: inputs.service == 'gcloud'

      # Blacksmith's builder keeps its layer cache on a disk of its own, under this
      # key. Without cache-key the action throws, catches its own error and quietly
      # falls back to a plain local builder, so every deploy would rebuild the image
      # from nothing. Keyed by the Dockerfile, the same key tests.yml uses: an app's
      # test and production targets usually share their early stages, so a deploy
      # picks up the layers the pull request runs keep warm. This replaces
      # jpribyl/action-docker-layer-caching, which saved and restored the whole
      # image store through the GitHub cache on every run.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v2.3.0
        with:
          cache-key: Dockerfile

      # The image is tagged with the commit that was checked out, which is the tag
      # the deployment script looks for (cd.sh in kubernetes_helper). github.sha is
      # not that commit when "App tests" on a release branch started this run: there
      # it names the default branch's head, so that deployment pointed the cluster
      # at a tag nothing had been pushed under.
      - name: Name the image tag
        id: commit
        run: echo "sha=$(git rev-parse --verify HEAD)" >> "$GITHUB_OUTPUT"

      - name: Calculate current version
        run: |
          git_hash=$(git rev-parse --verify HEAD || :)
          default_version=${git_hash:-$(date +%s)}
          deploy_version=$(git tag --contains $GIT_HASH | head -n 1)
          deploy_version=${deploy_version:-$default_version}
          echo "DEPLOY_VERSION=$deploy_version" >> $GITHUB_ENV

      - name: Install Specific Install gem
        run: sudo gem install specific_install

      - name: Install Kubernetes Helper with Specific Install
        # Pinned, and named under the organisation's current name. Unpinned, this installed
        # whatever the default branch happened to hold at the moment of the deployment, so
        # merging anything into that gem changed every application's next deploy with no
        # release, review or rollback in between. -t takes a git tag.
        run: sudo gem specific_install -l https://github.com/BuddyandSelly/kubernetes_helper -t v1.26.0

      # Staging deployment

      # These three steps replace a94763075/push-to-gar-github-action, which ran a
      # plain `docker build` and so could not use the builder's cache.
      - name: Google Cloud Authentication (Staging)
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.BETA_GOOGLE_AUTH }}
        if: ${{ env.STAGING_DEPLOY == 'true' }}

      - name: Login to Google Artifact Registry (Staging)
        uses: docker/login-action@v4.8.0
        with:
          username: _json_key
          password: ${{ secrets.BETA_GOOGLE_AUTH }}
          registry: ${{ inputs.GAR_BETA_REGION }}
        if: ${{ env.STAGING_DEPLOY == 'true' }}

      - name: Build & Push Docker Image to GAR (Staging)
        uses: useblacksmith/build-push-action@v2.3.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ inputs.DOCKER_BUILD_TARGET }}
          push: true
          tags: ${{ inputs.GAR_BETA_REGION }}/${{ inputs.GCP_STAGING_PROJECT_ID }}/${{ inputs.GAR_STAGING_REPO }}/${{ inputs.APP_NAME }}-staging:${{ steps.commit.outputs.sha }}
        if: ${{ env.STAGING_DEPLOY == 'true' }}

      - name: Staging Deployment
        env:
          KB_AUTH_TOKEN: ${{ secrets.BETA_GOOGLE_AUTH }}
          DEPLOY_ENV: ${{ env.STAGING_DEPLOY_ENV }}
          DEPLOY_VERSION: ${{ env.DEPLOY_VERSION }}
        run: kubernetes_helper run_deployment 'cd.sh'
        if: ${{ env.STAGING_DEPLOY == 'true' }}

      # Production deployment

      - name: Google Cloud Authentication (Production)
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.PROD_GOOGLE_AUTH }}
        if: ${{ env.PROD_DEPLOY == 'true' }}

      - name: Login to Google Artifact Registry (Production)
        uses: docker/login-action@v4.8.0
        with:
          username: _json_key
          password: ${{ secrets.PROD_GOOGLE_AUTH }}
          registry: ${{ inputs.GAR_PROD_REGION }}
        if: ${{ env.PROD_DEPLOY == 'true' }}

      - name: Build & Push Docker Image to GAR (Production)
        uses: useblacksmith/build-push-action@v2.3.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ inputs.DOCKER_BUILD_TARGET }}
          push: true
          tags: ${{ inputs.GAR_PROD_REGION }}/${{ inputs.GCP_PROD_PROJECT_ID }}/${{ inputs.GAR_PRODUCTION_REPO }}/${{ inputs.APP_NAME }}-production:${{ steps.commit.outputs.sha }}
        if: ${{ env.PROD_DEPLOY == 'true' }}

      - name: Production deployment
        env:
          KB_AUTH_TOKEN: ${{ secrets.PROD_GOOGLE_AUTH }}
          DEPLOY_ENV: production
          DEPLOY_VERSION: ${{ env.DEPLOY_VERSION }}
        run: kubernetes_helper run_deployment 'cd.sh'
        if: ${{ env.PROD_DEPLOY == 'true' }}

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug && always()
