name: App tests
on:
  workflow_call:
    inputs:
      copy_env:
        type: boolean
        required: false
        default: true

      # Backend
      copy_db_yml:
        type: boolean
        required: false
        default: false
      prepare_db_cmd:
        type: string
        required: false
        default: yarn install 2> /dev/null && bundle install && bundle exec rails db:setup
      rspec_cmd:
        type: string
        required: false
        default: bundle exec rspec
      run_rubocop:
        type: boolean
        required: false
        default: true

      # Frontend
      frontend_tests_cmd:
        type: string
        required: false
      eslint_cmd:
        type: string
        required: false

      # test coverage
      publish_coverage:
        type: boolean
        required: false
        default: false
      min_coverage:
        type: number
        required: false
        default: 90
      codeclimate_key:
        type: string
        required: false
        default: ''

      debug:
        type: boolean
        required: false
        default: false

jobs:
  rspec:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      DOCKER_CLIENT_TIMEOUT: 120
      COMPOSE_HTTP_TIMEOUT: 120

    steps:
      # common steps
      # Blacksmith keeps a git mirror on a sticky disk and updates it, instead of
      # cloning the repository from scratch every run. dissociate copies the objects
      # into the workspace, which docker-compose bind-mounts into the containers.
      - uses: useblacksmith/checkout@v1
        with:
          dissociate: true
      - name: Copy env vars file
        run: cp .env-example .env
        if: inputs.copy_env
      - name: Copy DB Config
        run: cp config/database-example.yml config/database.yml
        if: inputs.copy_db_yml
      - name: Cancel previous Workflow Actions
        uses: styfle/cancel-workflow-action@0.12.0
        with:
          access_token: ${{ github.token }}

      # docker caching
      - name: Cache ruby gems
        uses: actions/cache@v3
        with:
          key: ruby-gems
          path: |
            /usr/local/bundle/

      - name: Install Docker Compose
        uses: KengoTODA/actions-setup-docker-compose@v1
        with:
          version: '2.27.3'
      
      - name: download docker-compose cache
        run: docker-compose pull

      # Blacksmith's builder keeps its layer cache on a disk of its own, under this
      # key, so a rebuild reuses every layer up to the first change. Without
      # cache-key the action falls back to a plain local builder with no cache.
      # Keyed by the Dockerfile, the same key cd.yml uses. This replaces
      # jpribyl/action-docker-layer-caching, which saved and restored the whole
      # image store through the GitHub cache on every run.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v2.3.0
        with:
          cache-key: Dockerfile
      # docker-compose builds through the builder set up above and loads the image
      # into the local store, where the `docker-compose run test` steps below find
      # it. A step of its own, so the build shows up with its own time and log.
      - name: Build the test image
        run: docker-compose build test

      - name: Prepare backend DB
        env:
          ACTION_CMD: ${{ inputs.prepare_db_cmd }}
        run: docker-compose run test /bin/sh -c "sleep 5 && $ACTION_CMD"
        if: inputs.prepare_db_cmd

      - name: Check frontend tests
        env:
          TESTS_CMD: ${{ inputs.frontend_tests_cmd }}
        run: docker-compose run test /bin/sh -c "$TESTS_CMD"
        if: inputs.frontend_tests_cmd != ''

      - name: Check backend tests
        env:
          TESTS_CMD: ${{ inputs.rspec_cmd }}
        run: docker-compose run test /bin/sh -c "$TESTS_CMD"
        if: inputs.rspec_cmd != ''

      - name: Code style (Backend)
        run: docker-compose run test /bin/sh -c "bundle exec rubocop"
        if: inputs.run_rubocop

      - name: Code style (Frontend)
        run: docker-compose run test /bin/sh -c "$ESLINT_CMD"
        env:
          ESLINT_CMD: ${{ inputs.eslint_cmd }}
        if: inputs.eslint_cmd != ''

      - name: Upload final coverage results
        uses: actions/upload-artifact@v7
        with:
          name: final-coverage-report
          path: coverage
        if: inputs.publish_coverage

      - name: Simplecov Report
        uses: aki77/simplecov-report-action@v1
        with:
          failedThreshold: ${{ inputs.min_coverage }}
          token: ${{ secrets.GITHUB_TOKEN }}
        if: inputs.publish_coverage

      - name: Upload results to codeclimate
        env:
          CC_TEST_REPORTER_ID: ${{ inputs.codeclimate_key }}
        run: |
          docker-compose run test bash -c "
            apt-get install wget -y &&
            wget -O ./cc-test-reporter https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 &&  chmod +x ./cc-test-reporter &&
            ./cc-test-reporter format-coverage -t simplecov -o coverage/codeclimate.json &&
            ./cc-test-reporter upload-coverage -i coverage/codeclimate.json
          "
        if: ${{ inputs.codeclimate_key != '' }}

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug && always()

      - uses: actions/upload-artifact@v7
        with:
          name: capybara-screenshots
          path: tmp/capybara
        if: failure()
